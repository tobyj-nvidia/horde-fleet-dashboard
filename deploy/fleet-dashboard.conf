[program:fleet-dashboard]
command=%(ENV_HOME)s/horde-fleet-dashboard/.venv/bin/uvicorn dashboard.main:app --host 127.0.0.1 --port 8080 --workers 1
directory=%(ENV_HOME)s/horde-fleet-dashboard/src
environment=HOME="%(ENV_HOME)s",PYTHONPATH="%(ENV_HOME)s/horde-fleet-dashboard/src",DOLT_HOST="127.0.0.1",DOLT_PORT="3306",DOLT_DB="dolt-tasks",DOLT_USER="root"
stdout_logfile=%(ENV_HOME)s/.config/supervisor/logs/fleet-dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
