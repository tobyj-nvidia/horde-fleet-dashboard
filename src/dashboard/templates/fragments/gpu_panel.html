<div class="gpu-panel" hx-get="/fragments/gpu-panel" hx-trigger="every 15s" hx-swap="outerHTML">
  <div class="gpu-counters">
    <div class="status-count">
      <span class="label">GPU Queue</span>
      <span class="count {% if queue_depth > 0 %}status-pending{% else %}status-completed{% endif %}">{{ queue_depth }}</span>
    </div>
    <div class="status-count">
      <span class="label">OOM (24h)</span>
      <span class="count {% if oom_count > 0 %}status-failed{% else %}status-completed{% endif %}">{{ oom_count }}</span>
    </div>
  </div>

  {% if nodes %}
  <div class="gpu-gauges">
    {% for node in nodes %}
    <div class="gpu-gauge-card">
      <div class="node-metric-header">{{ node.node_id }}</div>
      <div class="gpu-gauge-row">
        <span class="metric-label" style="font-size:0.7rem;color:#666;text-transform:uppercase;width:2.5rem;flex-shrink:0;">GPU</span>
        <div class="gauge-bar-bg">
          <div class="gauge-bar-fill {% if node.gpu_util_pct >= 80 %}metric-red{% elif node.gpu_util_pct >= 60 %}metric-yellow{% else %}metric-green{% endif %}"
               style="width: {{ node.gpu_util_pct }}%;"></div>
        </div>
        <span class="metric-value {% if node.gpu_util_pct >= 80 %}metric-red{% elif node.gpu_util_pct >= 60 %}metric-yellow{% else %}metric-green{% endif %}" style="font-family:monospace;font-size:0.9rem;font-weight:bold;width:3rem;text-align:right;flex-shrink:0;">{{ node.gpu_util_pct }}%</span>
      </div>
      <div style="font-size:0.7rem;color:#666;margin-top:0.25rem;">{{ node.active_gpu_tasks }} / {{ node.gpu_capacity }} slots</div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="empty-state">No GPU-capable nodes</p>
  {% endif %}
</div>
