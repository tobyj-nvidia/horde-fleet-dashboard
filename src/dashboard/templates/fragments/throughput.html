<div hx-get="/fragments/throughput" hx-trigger="every 60s" hx-swap="outerHTML" class="fragment-throughput">
{% if not buckets %}
  <p class="no-data">No data for this window</p>
{% else %}
  <div class="sparkline" title="7-day task throughput">{{ spark }}</div>
  <table class="metric-table">
    <thead>
      <tr><th>Date</th><th>Total</th><th>Success</th><th>Failure</th><th>Dead Letter</th></tr>
    </thead>
    <tbody>
    {% for b in buckets %}
      <tr>
        <td>{{ b.date }}</td>
        <td>{{ b.total }}</td>
        <td>{{ b.success }}</td>
        <td class="{% if b.failure > 0 %}failure{% endif %}">{{ b.failure }}</td>
        <td class="{% if b.dead_letter > 0 %}failure{% endif %}">{{ b.dead_letter }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endif %}
</div>
