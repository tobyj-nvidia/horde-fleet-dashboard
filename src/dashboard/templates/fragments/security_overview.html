<div class="stat-tiles" id="security-overview-panel">
  <div class="stat-tile">
    <span class="stat-value">{{ total_invocations }}</span>
    <span class="stat-label">Invocations (24h)</span>
  </div>
  <div class="stat-tile">
    <span class="stat-value">{{ high_flags }}</span>
    <span class="stat-label">High-Risk Flags</span>
  </div>
  <div class="stat-tile">
    <span class="stat-value">{{ blocks }}</span>
    <span class="stat-label">Blocked</span>
  </div>
  <div class="stat-tile">
    <span class="stat-value">{{ unreviewed_alerts }}</span>
    <span class="stat-label">Unreviewed Alerts</span>
  </div>
  <div class="stat-tile">
    <span class="stat-value">{{ block_rate_pct }}%</span>
    <span class="stat-label">Block Rate</span>
  </div>
</div>
